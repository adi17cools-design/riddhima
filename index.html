<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Riddhima ✨</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    color:white;
    background:
        radial-gradient(circle at 20% 20%, #4c1d95, transparent 35%),
        radial-gradient(circle at 80% 80%, #831843, transparent 35%),
        linear-gradient(135deg,#090014,#17052c,#090014);
}

.star{
    position:fixed;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.2;transform:scale(.7);}
    to{opacity:1;transform:scale(1.5);}
}

.heart{
    position:fixed;
    bottom:-30px;
    font-size:20px;
    animation:rise 7s linear infinite;
    opacity:.7;
    pointer-events:none;
}

@keyframes rise{
    0%{
        transform:translateY(0) translateX(0) rotate(0);
        opacity:0;
    }
    20%{opacity:.8;}
    100%{
        transform:translateY(-110vh) translateX(80px) rotate(360deg);
        opacity:0;
    }
}

.container{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.card{
    width:100%;
    max-width:720px;
    padding:45px 35px;
    text-align:center;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.18);
    border-radius:30px;
    box-shadow:
        0 30px 100px rgba(0,0,0,.5),
        inset 0 0 30px rgba(255,255,255,.03);
    animation:appear 1.2s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(40px) scale(.95);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.small{
    font-size:15px;
    letter-spacing:3px;
    color:#c4b5fd;
    text-transform:uppercase;
}

.name{
    margin:12px 0;
    font-size:65px;
    font-weight:800;
    background:linear-gradient(
        90deg,
        #f9a8d4,
        #c4b5fd,
        #fbcfe8
    );
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:glow 3s infinite alternate;
}

@keyframes glow{
    from{
        filter:drop-shadow(0 0 5px rgba(244,114,182,.3));
    }
    to{
        filter:drop-shadow(0 0 20px rgba(244,114,182,.8));
    }
}

.subtitle{
    color:#ddd6fe;
    font-size:18px;
    margin-bottom:30px;
}

.message{
    padding:25px;
    border-radius:20px;
    background:rgba(255,255,255,.07);
    line-height:1.8;
    font-size:17px;
    margin-bottom:25px;
}

.highlight{
    color:#f9a8d4;
    font-weight:bold;
}

.quote{
    font-size:20px;
    font-style:italic;
    color:#fce7f3;
    margin:25px 0;
}

.checklist{
    text-align:left;
    max-width:500px;
    margin:25px auto;
}

.checklist h2{
    text-align:center;
    margin-bottom:15px;
}

.check{
    padding:13px 17px;
    margin:8px 0;
    background:rgba(255,255,255,.06);
    border-radius:12px;
    transition:.3s;
}

.check:hover{
    transform:translateX(8px);
    background:rgba(255,255,255,.12);
}

button{
    border:none;
    padding:15px 30px;
    border-radius:50px;
    background:linear-gradient(
        90deg,
        #ec4899,
        #8b5cf6
    );
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(236,72,153,.35);
    transition:.3s;
}

button:hover{
    transform:scale(1.07);
}

#secret{
    display:none;
    margin-top:30px;
    padding:25px;
    border-radius:20px;
    background:linear-gradient(
        135deg,
        rgba(236,72,153,.15),
        rgba(139,92,246,.15)
    );
    border:1px solid rgba(255,255,255,.12);
    animation:appear .8s ease;
}

.secretTitle{
    font-size:25px;
    margin-bottom:12px;
    color:#fbcfe8;
}

.final{
    font-size:21px;
    line-height:1.7;
}

.footer{
    margin-top:30px;
    color:#a78bfa;
    font-size:13px;
}

.confetti{
    position:fixed;
    width:9px;
    height:9px;
    top:-20px;
    z-index:100;
    animation:fall 3s linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

@media(max-width:600px){
    .name{font-size:48px;}
    .card{padding:35px 20px;}
}
</style>
</head>
